AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Farm Agent - the cloud database that connects every pod's identity (the number printed on its tag) to its crop type,
  growth stage, inspections, disease status, treatment history and harvest readiness. Facts only: images are never
  stored here. One DynamoDB table (on-demand billing) plus a least-privilege policy for the application.

Parameters:
  TableName:
    Type: String
    Default: FarmPods
    Description: Name of the DynamoDB table (set the same value in FARM_DDB_TABLE).

Resources:
  FarmTable:
    Type: AWS::DynamoDB::Table
    # Keep the data if this stack is ever deleted. (Delete the table by hand when you really mean it.)
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Ref TableName
      BillingMode: PAY_PER_REQUEST            # an idle farm costs ~nothing; no capacity to size
      AttributeDefinitions:
        - { AttributeName: pk,     AttributeType: S }
        - { AttributeName: sk,     AttributeType: S }
        - { AttributeName: gsi1pk, AttributeType: S }
        - { AttributeName: gsi1sk, AttributeType: S }
        - { AttributeName: gsi2pk, AttributeType: S }
        - { AttributeName: gsi2sk, AttributeType: S }
      KeySchema:
        - { AttributeName: pk, KeyType: HASH }
        - { AttributeName: sk, KeyType: RANGE }
      GlobalSecondaryIndexes:
        # "every lettuce pod"
        - IndexName: gsi_crop
          KeySchema:
            - { AttributeName: gsi1pk, KeyType: HASH }
            - { AttributeName: gsi1sk, KeyType: RANGE }
          Projection: { ProjectionType: ALL }
        # "every pod that is harvest_ready / disease_flagged / identity_unconfirmed ..."
        - IndexName: gsi_status
          KeySchema:
            - { AttributeName: gsi2pk, KeyType: HASH }
            - { AttributeName: gsi2sk, KeyType: RANGE }
          Projection: { ProjectionType: ALL }
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true      # restore the farm's history to any second in the last 35 days
      Tags:
        - { Key: app, Value: farm-agent }

  FarmAppPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      Description: Exactly what the Farm Agent application needs on its table - nothing more.
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: FarmTableReadWrite
            Effect: Allow
            Action:
              - dynamodb:PutItem
              - dynamodb:UpdateItem
              - dynamodb:GetItem
              - dynamodb:Query
              - dynamodb:DescribeTable
            Resource:
              - !GetAtt FarmTable.Arn
              - !Sub "${FarmTable.Arn}/index/*"

Outputs:
  TableName:
    Value: !Ref FarmTable
    Description: Put this in FARM_DDB_TABLE
  TableArn:
    Value: !GetAtt FarmTable.Arn
  AppPolicyArn:
    Value: !Ref FarmAppPolicy
    Description: Attach this managed policy to the IAM user or role the application runs as
